query JournalEditorial($id:ID!){article(id:$id){blocks:metafield(namespace:"$app",key:"editorial_blocks"){compareDigest references(first:50){nodes{... on Metaobject{fields{key value}}}}} products:metafield(namespace:"$app",key:"related_products"){jsonValue compareDigest} stories:metafield(namespace:"$app",key:"related_stories"){jsonValue compareDigest}}}

mutation JournalEditorialSet($metafields:[MetafieldsSetInput!]!){metafieldsSet(metafields:$metafields){metafields{id} userErrors{field message}}}

mutation JournalEditorialBlock($handle:MetaobjectHandleInput!,$metaobject:MetaobjectUpsertInput!){metaobjectUpsert(handle:$handle,metaobject:$metaobject){metaobject{id} userErrors{field message}}}

query JournalEditorialChoices{products(first:50){nodes{id title}} articles(first:100){nodes{id title}}}

query JournalLiveArticles($ids:[ID!]!){nodes(ids:$ids){... on Article{id title isPublished publishedAt}}}

mutation JournalBlogUpdate($id:ID!,$blog:BlogUpdateInput!){blogUpdate(id:$id,blog:$blog){blog{id title} userErrors{field message}}}

query JournalArticleEditor($id:ID!){article(id:$id){id title body tags updatedAt}}

query JournalBlogs($after:String){blogs(first:100,after:$after){nodes{id handle} pageInfo{hasNextPage endCursor}}}

mutation JournalBlogCreate($blog:BlogCreateInput!){blogCreate(blog:$blog){blog{id handle} userErrors{field message}}}

mutation JournalArticleCreate($article:ArticleCreateInput!){articleCreate(article:$article){article{id title summary tags} userErrors{field message}}}

query JournalArticle($id:ID!){article(id:$id){id title summary tags}}

query JournalRecover($query:String!){articles(first:10,query:$query){nodes{id handle blog{id}}}}

mutation JournalArticleUpdate($id:ID!,$article:ArticleUpdateInput!){articleUpdate(id:$id,article:$article){article{id title summary tags} userErrors{field message}}}